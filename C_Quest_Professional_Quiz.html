<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C Quest — C Language Challenge</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070b16;color:#f8fafc;font-family:Inter,sans-serif;background-image:radial-gradient(circle at 10% 10%,#4327a944,transparent 30%),radial-gradient(circle at 90% 90%,#00c8ff22,transparent 30%)}.app{width:min(900px,94%);margin:auto;padding:25px 0 45px}.logo{text-align:center;font:700 26px 'Space Grotesk';margin-bottom:20px}.logo span{color:#8b72ff}.screen{display:none;animation:in .4s}.active{display:block}@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.glass{background:#101727dd;border:1px solid #ffffff14;border-radius:24px;box-shadow:0 25px 70px #0008;backdrop-filter:blur(15px)}.hero{text-align:center;padding:55px 20px}.icon{width:90px;height:90px;margin:auto auto 22px;display:grid;place-items:center;border-radius:27px;background:linear-gradient(135deg,#7c5cff,#00c8ff);font-size:42px;animation:float 3s infinite ease-in-out}@keyframes float{50%{transform:translateY(-8px)}}h1{font:700 clamp(40px,8vw,64px) 'Space Grotesk';line-height:.98;letter-spacing:-2px;margin:0 0 16px}.hero p{color:#94a3b8;line-height:1.6;max-width:550px;margin:0 auto 28px}.startbox{max-width:470px;margin:auto;padding:20px}input{width:100%;padding:16px;border-radius:13px;border:1px solid #ffffff15;background:#080e1c;color:white;font-size:16px;outline:none}input:focus{border-color:#7c5cff}.btn{border:0;border-radius:13px;padding:14px 19px;font:700 15px Inter;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px)}.primary{width:100%;margin-top:11px;color:#fff;background:linear-gradient(135deg,#7c5cff,#527cff)}.top{display:flex;justify-content:space-between;color:#cbd5e1;font-weight:700;font-size:14px;margin-bottom:12px}.scoremini{color:#94a3b8;font-weight:500}.progress{height:8px;background:#1e293b;border-radius:99px;margin-bottom:22px;overflow:hidden}.progress i{display:block;height:100%;width:5%;background:linear-gradient(90deg,#7c5cff,#00d4ff);transition:.4s}.card{padding:27px}.tag{font-size:12px;letter-spacing:2px;color:#9b87ff;font-weight:800}.question{font:700 clamp(22px,4vw,31px) 'Space Grotesk';line-height:1.3;margin:10px 0 24px}.options{display:grid;gap:11px}.option{width:100%;display:flex;gap:13px;align-items:center;text-align:left;padding:15px;background:#111a2b;border:1px solid #26334c;color:#e2e8f0;border-radius:14px;cursor:pointer;font:600 15px Inter;transition:.2s}.option:hover{border-color:#7c5cff;transform:translateX(3px)}.letter{width:34px;height:34px;min-width:34px;display:grid;place-items:center;background:#202b42;border-radius:9px}.correct{background:#12351f;border-color:#22c55e}.correct .letter{background:#22c55e;color:#04130a}.wrong{background:#3b151b;border-color:#ef4444;animation:shake .3s}.wrong .letter{background:#ef4444}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.locked{cursor:default!important}.explain{display:none;margin-top:15px;padding:13px 15px;background:#0b1220;border-radius:12px;color:#94a3b8;font-size:13px;line-height:1.5}.show{display:block}.nav{display:flex;justify-content:space-between;margin-top:19px}.next{background:#fff;color:#090d17;min-width:115px}.next:disabled{opacity:.35;cursor:not-allowed}.quit{background:transparent;color:#94a3b8}.result{text-align:center;padding:35px 20px 18px}.trophy{font-size:62px;animation:float 2.5s infinite}.result h2{font:700 38px 'Space Grotesk';margin:8px 0}.muted{color:#94a3b8}.ring{width:185px;height:185px;margin:25px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#7c5cff var(--deg),#202a3e 0);position:relative}.ring:after{content:'';position:absolute;inset:11px;background:#101727;border-radius:50%}.inside{position:relative;z-index:2}.big{font:700 42px 'Space Grotesk'}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 auto 20px;max-width:600px}.stat{padding:15px 7px;background:#111a2b;border:1px solid #ffffff0d;border-radius:14px}.stat b{display:block;font-size:23px}.stat small{color:#94a3b8}.green{color:#4ade80}.red{color:#fb7185}.cyan{color:#67e8f9}.review{text-align:left;padding:18px;margin:0 auto 20px;max-width:700px}.review h3{margin:0 0 10px}.row{padding:11px 0;border-bottom:1px solid #ffffff0d;font-size:13px;line-height:1.5}.row:last-child{border:0}.credit{color:#64748b;font-size:13px;margin-top:22px}.credit strong{color:#a78bfa}@media(max-width:600px){.hero{padding:42px 12px}.card{padding:20px}.stats{gap:7px}}
</style></head>
<body><div class="app">
<div class="logo">C <span>QUEST</span></div>

<section id="start" class="screen active"><div class="glass hero">
<div class="icon">&lt;/&gt;</div><h1>C Language<br>Challenge</h1>
<p>20 questions. One mission. Test your C programming fundamentals and see how much you really know.</p>
<div class="startbox"><input id="name" maxlength="30" placeholder="Enter your name"><button class="btn primary" onclick="start()">Start Challenge →</button></div>
</div></section>

<section id="quiz" class="screen"><div class="top"><span id="count"></span><span id="ls" class="scoremini"></span></div><div class="progress"><i id="bar"></i></div>
<div class="glass card"><div id="tag" class="tag"></div><h2 id="q" class="question"></h2><div id="opts" class="options"></div><div id="exp" class="explain"></div>
<div class="nav"><button class="btn quit" onclick="quit()">Exit</button><button id="next" class="btn next" disabled onclick="next()">Next →</button></div></div></section>

<section id="result" class="screen"><div class="glass result"><div class="trophy">🏆</div><div class="muted">CHALLENGE COMPLETE</div><h2 id="rn"></h2><div id="msg" class="muted"></div>
<div id="ring" class="ring"><div class="inside"><div id="fs" class="big"></div><div id="fp" class="muted"></div></div></div>
<div class="stats"><div class="stat"><b id="cor" class="green"></b><small>CORRECT</small></div><div class="stat"><b id="wro" class="red"></b><small>WRONG</small></div><div class="stat"><b id="mar" class="cyan"></b><small>MARKS</small></div></div>
<div class="glass review"><h3>Answer Review</h3><div id="review"></div></div>
<button class="btn primary" onclick="again()">Play Again ↻</button><div class="credit">Made by <strong>Priyanshu</strong></div>
</div></section>
</div>

<script>
const qs=[
["Which header file is commonly used for printf() and scanf()?",["stdlib.h","stdio.h","string.h","math.h"],1,"stdio.h provides standard input/output functions."],
["Which symbol gets the address of a variable in C?",["*","&","%","#"],1,"& gives the address of its operand and is commonly used with scanf()."],
["What is the output of printf('%d',10 % 3)?",["0","1","3","10"],1,"10 divided by 3 leaves remainder 1."],
["Which format specifier is used for an integer?",["%f","%c","%d","%s"],2,"%d is used for int values."],
["Which operator checks equality?",["=","==","!=","<="],1,"= assigns; == compares equality."],
["What does i++ do?",["Decreases i","Increases i by 1","Doubles i","Sets i to 0"],1,"++ increments a value by one."],
["Which loop checks its condition after the body?",["while","for","do-while","if"],2,"do-while checks its condition after executing the body."],
["What happens when break executes inside a loop?",["Restarts it","Changes the value","Terminates the loop","Crashes the program"],2,"break exits the nearest loop."],
["Which statement makes a decision based on a condition?",["if","loop","scan","define"],0,"if executes its block when its condition is true."],
["What is 7 / 2 when both operands are int?",["3","3.5","4","2"],0,"Integer division discards the fractional part."],
["Which is a correct integer declaration?",["integer x;","int x;","num x;","x int;"],1,"int is the C keyword for integer variables."],
["What does && mean?",["OR","NOT","AND","Equal"],2,"&& is logical AND; both conditions must be true."],
["Which operator is useful for checking even numbers?",["/","%","*","+"],1,"n % 2 gives the remainder after division by 2."],
["Which keyword returns control from a function?",["break","stop","return","continue"],2,"return ends the current function and can return a value."],
["What is x after int x=5; x=x+2;?",["2","5","7","10"],2,"5 plus 2 equals 7."],
["Which is a valid single-line C comment?",["<!-- comment -->","// comment","# comment","** comment **"],1,"C supports // for single-line comments."],
["What does continue do in a loop?",["Ends program","Skips to next iteration","Ends loop","Restarts main()"],1,"continue skips the rest of the current iteration."],
["Which is a character data type?",["int","float","char","double"],2,"char stores a character such as A."],
["What is the normal entry point of a C program?",["start()","run()","main()","begin()"],2,"Execution normally begins in main()."],
["If while(1) has no break, what happens?",["Runs once","Never executes","Can become an infinite loop","Becomes a for loop"],2,"1 is always true, so the loop keeps running."]
];
let i=0,s=0,name="",ans=[],picked=false;
function screen(x){document.querySelectorAll(".screen").forEach(e=>e.classList.remove("active"));document.getElementById(x).classList.add("active")}
function start(){name=document.getElementById("name").value.trim();if(!name){alert("Please enter your name.");return}i=0;s=0;ans=Array(20).fill(null);picked=false;screen("quiz");render()}
function render(){let x=qs[i];document.getElementById("count").textContent=`Question ${i+1} / 20`;document.getElementById("ls").textContent=`Score: ${s}`;document.getElementById("bar").style.width=((i+1)*5)+"%";document.getElementById("tag").textContent=`QUESTION ${String(i+1).padStart(2,"0")}`;document.getElementById("q").textContent=x[0];let box=document.getElementById("opts");box.innerHTML="";
x[1].forEach((v,j)=>{let b=document.createElement("button");b.className="option";b.innerHTML=`<span class="letter">${"ABCD"[j]}</span><span>${v}</span>`;if(ans[i]!==null){b.classList.add("locked");if(j===x[2])b.classList.add("correct");if(j===ans[i]&&j!==x[2])b.classList.add("wrong")}else b.onclick=()=>choose(j);box.appendChild(b)});
let e=document.getElementById("exp");e.textContent=ans[i]!==null?x[3]:"";e.classList.toggle("show",ans[i]!==null);picked=ans[i]!==null;let n=document.getElementById("next");n.disabled=!picked;n.textContent=i===19?"Finish Quiz":"Next →"}
function choose(j){if(picked)return;picked=true;ans[i]=j;if(j===qs[i][2])s++;render()}
function next(){if(!picked)return;if(i<19){i++;picked=false;render()}else finish()}
function finish(){let p=Math.round(s/20*100);document.getElementById("rn").textContent=name;document.getElementById("fs").textContent=`${s}/20`;document.getElementById("fp").textContent=p+"%";document.getElementById("cor").textContent=s;document.getElementById("wro").textContent=20-s;document.getElementById("mar").textContent=`${s}/20`;document.getElementById("ring").style.setProperty("--deg",p*3.6+"deg");document.getElementById("msg").textContent=p>=80?"Excellent C fundamentals!":p>=60?"Good job — keep practicing!":p>=40?"Decent start — practice more C.":"Keep practicing. You can improve this score!";
let r=document.getElementById("review");r.innerHTML="";qs.forEach((x,k)=>{let ok=ans[k]===x[2],d=document.createElement("div");d.className="row";d.innerHTML=`<b>${k+1}. ${x[0]} <span class="${ok?"green":"red"}">${ok?"✓":"✗"}</span></b>Your answer: ${ans[k]===null?"Not answered":x[1][ans[k]]}`;r.appendChild(d)});screen("result")}
function again(){document.getElementById("name").value=name;screen("start")}
function quit(){if(confirm("Exit the quiz? Current progress will be lost."))screen("start")}
</script></body></html>
